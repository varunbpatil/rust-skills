[package]
name = "rust-skills-checks"
version = "0.0.0"
edition = "2024"
publish = false

# Harness for compile-checking the ```rust examples in ../rules/*.md.
# Each candidate block is generated into examples/ and type-checked with
# `cargo check --examples`. Not part of the published skill.

[lib]
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["full"] }
futures = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
anyhow = "1.0.104"
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
log = "0.4.34"
smallvec = "1.16.1"
arrayvec = "0.7.8"
thin-vec = "0.2.20"
bytes = "1.12.1"
compact_str = "0.10.0"
smartstring = "1.0.1"
once_cell = "1.21.4"
parking_lot = "0.12.5"
rayon = "1.12.0"
rustc-hash = "2.1.3"
ahash = "0.8.12"
secrecy = "0.10.3"
subtle = "2.6.1"
memchr = "2.8.3"
static_assertions = "1.1.0"
bumpalo = { version = "3.20.3", features = ["collections"] }
indexmap = "2.14.2"
tempfile = "3.27.0"
scopeguard = "1.2.0"
mockall = "0.15.0"
proptest = "1.11.0"
proptest-derive = "0.8.0"
insta = { version = "1.48.0", features = ["json"] }
criterion = "0.8.2"
loom = "0.7.2"
async-trait = "0.1.92"
autocfg = "1.5.1"
bitflags = "2.13.2"
ecow = "0.3.1"
http = "1.5.0"
libc = "0.2.189"
reqwest = { version = "0.13.5", features = ["blocking", "json"] }
tinyvec = { version = "1.13.3", features = ["alloc"] }
toml = "1.1.6+spec-1.1.0"
trybuild = "1.0.121"
url = "2.5.8"
uuid = { version = "1.26.1", features = ["v4"] }
vec1 = "1.12.1"
wide = "1.7.1"
flate2 = "1.1.10"
bcrypt = "0.19.3"
syn = { version = "3.0.6", features = ["full", "extra-traits", "derive"] }
quote = "1.0.47"
proc-macro2 = "1.0.107"

[profile.dev]
debug = false
